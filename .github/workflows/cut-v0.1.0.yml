name: Cut TestGraph v0.1.0

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/cut-v0.1.0.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Create v0.1.0 tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TARGET=$(git rev-parse HEAD^)
          cat > /tmp/release-notes.md <<'EOF'
          Initial experimental release of TestGraph.

          Highlights:
          - shared, evidence-backed experience graph for multiple AI assistants
          - OAuth 2.1 + PKCE MCP v2 integration exercised with ChatGPT and Claude
          - governed vocabulary, subject enrichment, location assertions and cross-model deliberation
          - exact-experience AI assessments with provenance
          - idempotent writes, structured conflicts and server-verifiable execution
          - AGPL-3.0 source licence with alternative licensing available via testgraph@21dle.co.uk
          - UCI recipe review data retained under CC BY 4.0 with separate attribution

          This is an experimental v0.1.0 release; the MCP/tool surface and graph-governance rules may evolve.
          EOF
          gh release create v0.1.0 \
            --target "$TARGET" \
            --title "TestGraph v0.1.0" \
            --notes-file /tmp/release-notes.md

      - name: Remove one-shot release workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/cut-v0.1.0.yml
          git commit -m 'Remove one-shot v0.1.0 release workflow'
          git push origin HEAD:master

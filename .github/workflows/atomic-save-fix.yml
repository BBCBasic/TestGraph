name: Apply atomic save fix

on:
  push:
    branches: [fix/save-experience-atomic-retry]

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/save-experience-atomic-retry
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply transaction fix and regression test
        run: python scripts/apply_atomic_save_fix.py

      - name: Run targeted regression
        env:
          ENVIRONMENT: test
          DATABASE_URL: sqlite:///./testgraph_atomic_ci.db
          APP_SECRET: ci-only-not-a-production-secret
          DEVELOPMENT_API_KEY: ci-only-development-key
          ENABLE_DEVELOPMENT_RESET: "false"
          CLIENT_API_KEYS: "{}"
          PUBLIC_BASE_URL: http://127.0.0.1:8000
          ALLOWED_HOSTS: '["127.0.0.1","localhost","testserver"]'
          CORS_ORIGINS: '["http://127.0.0.1:8000"]'
          OAUTH_OWNER_USER_ID: ""
          OAUTH_CONNECTION_CODE: ci-only-oauth-code
        run: python -m pytest -q tests/test_save_experience_atomic.py

      - name: Run full test suite
        env:
          ENVIRONMENT: test
          DATABASE_URL: sqlite:///./testgraph_atomic_ci.db
          APP_SECRET: ci-only-not-a-production-secret
          DEVELOPMENT_API_KEY: ci-only-development-key
          ENABLE_DEVELOPMENT_RESET: "false"
          CLIENT_API_KEYS: "{}"
          PUBLIC_BASE_URL: http://127.0.0.1:8000
          ALLOWED_HOSTS: '["127.0.0.1","localhost","testserver"]'
          CORS_ORIGINS: '["http://127.0.0.1:8000"]'
          OAUTH_OWNER_USER_ID: ""
          OAUTH_CONNECTION_CODE: ci-only-oauth-code
        run: python -m pytest -q

      - name: Remove temporary patch machinery
        run: rm scripts/apply_atomic_save_fix.py .github/workflows/atomic-save-fix.yml

      - name: Commit tested fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/mcp_v2.py app/services/v2.py tests/test_save_experience_atomic.py scripts/apply_atomic_save_fix.py .github/workflows/atomic-save-fix.yml
          git commit -m "Make save_experience atomic"
          git push origin HEAD:fix/save-experience-atomic-retry

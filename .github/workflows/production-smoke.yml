name: Production smoke test

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/production-smoke.yml'

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run smoke checks without exposing capability secrets
        shell: bash
        run: |
          set -uo pipefail
          failures=0
          : > PRODUCTION_SMOKE_RESULT.md
          echo '# Production Smoke Result' >> PRODUCTION_SMOKE_RESULT.md
          echo >> PRODUCTION_SMOKE_RESULT.md
          echo "Run: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> PRODUCTION_SMOKE_RESULT.md
          echo >> PRODUCTION_SMOKE_RESULT.md

          check() {
            name="$1"; shift
            if "$@"; then
              echo "- [x] $name" >> PRODUCTION_SMOKE_RESULT.md
            else
              echo "- [ ] $name" >> PRODUCTION_SMOKE_RESULT.md
              failures=$((failures+1))
            fi
          }

          homepage() {
            curl -fsS -o /tmp/home.html https://testgraph.21dle.co.uk/ >/dev/null && grep -qi 'TestGraph\|TasteGraph' /tmp/home.html
          }

          readiness() {
            curl -fsS -o /tmp/ready.json https://testgraph.21dle.co.uk/health/ready >/dev/null &&
              grep -q '"ready"' /tmp/ready.json && grep -q '"database"' /tmp/ready.json && grep -q '"ok"' /tmp/ready.json
          }

          resource_metadata() {
            curl -fsS -o /tmp/resource.json https://testgraph.21dle.co.uk/.well-known/oauth-protected-resource/mcp-v2 >/dev/null &&
              grep -q 'https://testgraph.21dle.co.uk/mcp-v2' /tmp/resource.json
          }

          oauth_metadata() {
            curl -fsS -o /tmp/oauth.json https://testgraph.21dle.co.uk/.well-known/oauth-authorization-server >/dev/null &&
              grep -q 'authorization_endpoint' /tmp/oauth.json && grep -q 'token_endpoint' /tmp/oauth.json
          }

          mcp_boundary() {
            code=$(curl -sS -o /tmp/mcp.txt -w '%{http_code}' https://testgraph.21dle.co.uk/mcp-v2) || return 1
            test "$code" = "401" -o "$code" = "405"
          }

          vocabulary() {
            curl -fsS -o /tmp/vocabulary.json https://testgraph.21dle.co.uk/api/v2/vocabulary >/dev/null && test -s /tmp/vocabulary.json
          }

          capability_html() {
            curl -fsS -H 'Accept: text/html' -D /tmp/cap.headers -o /tmp/cap.html https://testgraph.21dle.co.uk/capability/new >/dev/null &&
              grep -q 'Your private TestGraph capability URL' /tmp/cap.html &&
              grep -q 'Copy URL' /tmp/cap.html &&
              grep -qi '^cache-control: no-store' /tmp/cap.headers
          }

          capability_json() {
            curl -fsS -H 'Accept: application/json' -o /tmp/cap.json https://testgraph.21dle.co.uk/capability/new >/dev/null || return 1
            python - <<'PY'
          import json
          with open('/tmp/cap.json', encoding='utf-8') as f:
              data=json.load(f)
          assert isinstance(data.get('personal_url'), str) and data['personal_url'].startswith('https://testgraph.21dle.co.uk/c/tg_')
          assert 'authentication' in data
          PY
          }

          check 'Homepage responds' homepage
          check 'Readiness reports database OK' readiness
          check 'OAuth protected-resource metadata uses custom MCP v2 URL' resource_metadata
          check 'OAuth authorization-server metadata is complete' oauth_metadata
          check 'MCP v2 rejects unauthenticated access cleanly' mcp_boundary
          check 'Public vocabulary responds' vocabulary
          check 'Capability browser page renders safely' capability_html
          check 'Capability JSON compatibility remains intact' capability_json

          echo >> PRODUCTION_SMOKE_RESULT.md
          if [ "$failures" -eq 0 ]; then
            echo '**Overall: PASS**' >> PRODUCTION_SMOKE_RESULT.md
          else
            echo "**Overall: FAIL ($failures checks failed)**" >> PRODUCTION_SMOKE_RESULT.md
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PRODUCTION_SMOKE_RESULT.md
          git commit -m 'Record production smoke result' || true
          git push

          test "$failures" -eq 0

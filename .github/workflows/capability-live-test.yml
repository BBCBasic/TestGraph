name: Capability live round-trip

on:
  push:
    branches: [master]
    paths-ignore:
      - live-test-result.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  live-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Railway and test GET-only write/read
        id: live_test
        continue-on-error: true
        env:
          BASE_URL: https://web-production-299bb.up.railway.app
        run: |
          python - <<'PY'
          import base64, json, os, time, traceback, urllib.parse, urllib.request

          base = os.environ['BASE_URL'].rstrip('/')
          result = {"status": "failed", "base_url": base, "tested_at": int(time.time())}

          def get_json(url, retries=20):
              last = None
              for i in range(retries):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent':'TasteGraph-live-test/1.0'})
                      with urllib.request.urlopen(req, timeout=20) as r:
                          if r.status != 200:
                              raise RuntimeError(f'HTTP {r.status}')
                          return json.loads(r.read().decode())
                  except Exception as exc:
                      last = exc
                      time.sleep(min(5 + i, 15))
              raise RuntimeError(f'GET failed after retries: {url}: {last}')

          try:
              personal = None
              manifest = None
              for _ in range(30):
                  try:
                      new = get_json(base + '/capability/new', retries=1)
                      personal = new['personal_url']
                      key = personal.rsplit('/', 1)[-1]
                      print(f'::add-mask::{key}')
                      manifest = get_json(personal, retries=1)
                      if 'prepare_review' in manifest.get('endpoints', {}):
                          break
                  except Exception:
                      pass
                  time.sleep(10)
              else:
                  raise RuntimeError('Railway never exposed prepare_review endpoint')

              unique = str(int(time.time()))
              payload = {
                  'subject_type': 'recipe',
                  'subject_name': 'TasteGraph GET Capability Live Test Recipe',
                  'canonical_key': 'tastegraph-get-capability-live-test-' + unique,
                  'headline': '[TEST] GET-only capability write succeeded',
                  'summary': 'Fictional automated review created to verify GET prepare, GET commit, and GET read-back against the live TasteGraph service.',
                  'common_data': {},
                  'domain_data': {},
                  'visibility': 'private',
                  'user_approved': True,
                  'idempotency_key': 'github-live-test-' + unique,
                  'source_client': 'github-actions-live-test'
              }
              raw = json.dumps(payload, separators=(',', ':')).encode()
              encoded = base64.urlsafe_b64encode(raw).rstrip(b'=').decode()
              prepare_url = manifest['endpoints']['prepare_review'].replace('{base64url_json}', urllib.parse.quote(encoded, safe=''))
              prepared = get_json(prepare_url)
              assert prepared['prepared'] is True and prepared['saved'] is False, prepared
              committed = get_json(prepared['commit_url'])
              assert committed['saved'] is True, committed
              stored = get_json(committed['read_back_url'])

              assert stored['headline'] == payload['headline'], stored
              assert stored['summary'] == payload['summary'], stored
              assert stored['subject']['name'] == payload['subject_name'], stored
              assert stored['publication_status'] == 'published', stored

              result = {
                  'status': 'passed',
                  'tested_at': int(time.time()),
                  'experience_id': stored['id'],
                  'headline': stored['headline'],
                  'summary': stored['summary'],
                  'subject_name': stored['subject']['name'],
                  'publication_status': stored['publication_status'],
                  'read_back_url': committed['read_back_url'],
                  'flow': ['GET capability/new', 'GET capability manifest', 'GET prepare-review', 'GET commit', 'GET read-back']
              }
              print('ROUND_TRIP_OK')
          except Exception as exc:
              result['error'] = str(exc)
              result['traceback'] = traceback.format_exc()[-4000:]
              print(result['traceback'])
          finally:
              with open('live-test-result.json', 'w') as f:
                  json.dump(result, f, indent=2)
          PY

      - name: Commit live-test result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live-test-result.json
          git commit -m "Record capability live-test result" || exit 0
          git push

      - name: Fail job if round-trip failed
        if: always()
        run: |
          python - <<'PY'
          import json, sys
          with open('live-test-result.json') as f:
              result = json.load(f)
          print(json.dumps(result, indent=2))
          if result.get('status') != 'passed':
              sys.exit(1)
          PY

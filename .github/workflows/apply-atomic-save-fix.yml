name: Apply atomic save fix

on:
  push:
    branches: [fix/save-experience-atomic-retry]

permissions:
  contents: write

jobs:
  apply-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[atomic-fix-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/save-experience-atomic-retry
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply targeted source changes and regression test
        run: python scripts/apply_atomic_save_fix.py
      - name: Run full test suite
        env:
          ENVIRONMENT: test
          DATABASE_URL: sqlite:///./testgraph_ci.db
          APP_SECRET: ci-only-not-a-production-secret
          DEVELOPMENT_API_KEY: ci-only-development-key
          ENABLE_DEVELOPMENT_RESET: 'false'
          CLIENT_API_KEYS: '{}'
          PUBLIC_BASE_URL: http://127.0.0.1:8000
          ALLOWED_HOSTS: '["127.0.0.1","localhost","testserver"]'
          CORS_ORIGINS: '["http://127.0.0.1:8000"]'
          OAUTH_OWNER_USER_ID: ''
          OAUTH_CONNECTION_CODE: ci-only-oauth-code
        run: python -m pytest -q
      - name: Commit verified fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/services/v2.py app/api/mcp_v2.py tests/test_save_experience_atomic.py
          git commit -m 'Make save_experience graph writes atomic [atomic-fix-applied]'
          git push origin HEAD:fix/save-experience-atomic-retry

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run test suite
        env:
          ENVIRONMENT: test
          DATABASE_URL: sqlite:///./testgraph_ci.db
          APP_SECRET: ci-only-not-a-production-secret
          DEVELOPMENT_API_KEY: ci-only-development-key
          ENABLE_DEVELOPMENT_RESET: "false"
          CLIENT_API_KEYS: "{}"
          PUBLIC_BASE_URL: http://127.0.0.1:8000
          ALLOWED_HOSTS: '["127.0.0.1","localhost","testserver"]'
          CORS_ORIGINS: '["http://127.0.0.1:8000"]'
          OAUTH_OWNER_USER_ID: ""
          OAUTH_CONNECTION_CODE: ci-only-oauth-code
        run: pytest -q

name: Create v0.1.1 release

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/release-v0.1.1.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Tag tested release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target=$(git rev-parse HEAD^)
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a v0.1.1 "$target" -m 'TestGraph v0.1.1'
          git push origin v0.1.1
          gh release create v0.1.1 --target "$target" --title 'TestGraph v0.1.1' --notes 'Patch release for the tested capability-page fixes and production smoke verification. See CHANGELOG.md for details.'
      - name: Remove one-shot workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD:.github/workflows/release-v0.1.1.yml)
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/release-v0.1.1.yml" \
            -f message='Remove one-shot v0.1.1 release workflow' \
            -f sha="$sha" \
            -f branch='master'

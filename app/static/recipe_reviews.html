<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recipe Reviews</title><style>body{font-family:system-ui;margin:0;background:#f5f6f8;color:#172033}header{position:sticky;top:0;background:white;padding:12px;border-bottom:1px solid #ddd;z-index:2}input,select,button{font:inherit;padding:9px;border:1px solid #ccc;border-radius:8px}main{display:grid;grid-template-columns:320px 1fr;gap:12px;padding:12px}.panel{background:white;border:1px solid #ddd;border-radius:10px;overflow:hidden}.list{max-height:calc(100vh - 110px);overflow:auto}.recipe{padding:11px;border-bottom:1px solid #eee}.recipe.active{background:#eef3ff}.recipe b{display:block}.muted{color:#6b7280;font-size:13px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;padding:12px;border-bottom:1px solid #eee}.review{padding:14px;border-bottom:1px solid #eee}.reviewtext{white-space:pre-wrap;font-family:Georgia,serif;font-size:16px;line-height:1.5}.actions{margin-top:10px;display:flex;gap:7px}.grow{flex:1}@media(max-width:800px){main{grid-template-columns:1fr}.list{max-height:300px}}</style></head><body><header><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b>UCI Recipe Reviews</b><input id="q" class="grow" placeholder="Search recipes"><span id="status" class="muted">Loading…</span></div></header><main><section class="panel"><div class="toolbar"><b>Recipes</b></div><div id="recipes" class="list"></div></section><section class="panel"><div class="toolbar"><div class="grow"><b id="title">Choose a recipe</b><div id="sub" class="muted"></div></div><select id="stars"><option value="">All stars</option><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option><option value="0">Unrated</option></select><button id="copy10">Copy first 10</button></div><div id="reviews"></div></section></main><script>let recipes=[],selected=null,reviews=[];const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function loadRecipes(){let q=$('#q').value.trim();$('#status').textContent='Loading…';let r=await fetch('/tools/recipe-reviews/api/recipes?q='+encodeURIComponent(q));let j=await r.json();recipes=j.recipes||[];$('#status').textContent=`${j.count||0} recipes · ${j.source||''}`;$('#recipes').innerHTML=recipes.map(x=>`<div class="recipe ${selected===x.recipe_code?'active':''}" data-code="${esc(x.recipe_code)}"><b>${esc(x.recipe_name)}</b><span class="muted">${x.review_count} reviews</span></div>`).join('');document.querySelectorAll('.recipe').forEach(e=>e.onclick=()=>choose(e.dataset.code))}async function choose(code){selected=code;let x=recipes.find(r=>r.recipe_code===code);$('#title').textContent=x?x.recipe_name:code;await loadReviews();loadRecipes()}async function loadReviews(){if(!selected)return;let u='/tools/recipe-reviews/api/reviews?recipe_code='+encodeURIComponent(selected)+'&limit=200';if($('#stars').value!=='')u+='&stars='+$('#stars').value;let r=await fetch(u);let j=await r.json();reviews=j.reviews||[];$('#sub').textContent=`${reviews.length} reviews shown`;$('#reviews').innerHTML=reviews.map((x,i)=>`<article class="review"><b>${x.stars?('★'.repeat(x.stars)):'Unrated'} · ${esc(x.user_name)}</b><div class="reviewtext">${esc(x.text)}</div><div class="actions"><button data-i="${i}" class="copy">Copy</button><button data-i="${i}" class="copygpt">Copy for GPT</button></div></article>`).join('')||'<div class="review muted">No reviews.</div>';document.querySelectorAll('.copy').forEach(b=>b.onclick=()=>copy(reviews[+b.dataset.i].text||''));document.querySelectorAll('.copygpt').forEach(b=>b.onclick=()=>copy(block(reviews[+b.dataset.i]))}function block(x){let y=recipes.find(r=>r.recipe_code===selected);return `Recipe: ${y?.recipe_name||selected}\nRecipe code: ${selected}\nExternal human review\nSource stars: ${x.stars??''}\nReviewer: ${x.user_name||'Unknown'}\nComment ID: ${x.comment_id||''}\n\nReview:\n${x.text||''}`}async function copy(t){await navigator.clipboard.writeText(t);$('#status').textContent='Copied';setTimeout(()=>$('#status').textContent=`${recipes.length} recipes`,1000)}$('#q').oninput=()=>{clearTimeout(window.t);window.t=setTimeout(loadRecipes,250)};$('#stars').onchange=loadReviews;$('#copy10').onclick=()=>copy(reviews.slice(0,10).map((x,i)=>`--- REVIEW ${i+1} ---\n${block(x)}`).join('\n\n'));loadRecipes();</script></body></html>
